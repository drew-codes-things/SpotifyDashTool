[project]
name = "spotify-mcp-sorter"
version = "0.1.0"
description = "MCP server for Spotify: playback control + playlist management for SpotifyDashTool"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2,<2",
    "spotipy>=2.26.0",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
