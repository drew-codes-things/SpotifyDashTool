[project]
name = "spotify-mcp-sorter"
version = "0.1.0"
description = "MCP server for Spotify — playback control + playlist management ported from SpotifySortTool"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]",
    # 2.26 moved to Spotify's renamed endpoints (/playlists/{id}/items, /me/library);
    # older versions call ones Spotify has since removed.
    "spotipy>=2.26.0",
    "requests",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
